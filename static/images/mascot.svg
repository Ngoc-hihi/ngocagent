<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="anoraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="50%" stop-color="#F2EAE0"/>
      <stop offset="100%" stop-color="#E5D9CC"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7D8B74"/>
      <stop offset="100%" stop-color="#4E5D46"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D8DA"/>
      <stop offset="100%" stop-color="#E2A6A9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5C6B52" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Circle Background -->
  <circle cx="80" cy="80" r="70" fill="url(#anoraGlow)" stroke="#D8C9BB" stroke-width="1.5" filter="url(#softShadow)"/>
  
  <!-- Outer Botanical Leaf Ring -->
  <g stroke="#7D8B74" stroke-width="1.2" fill="none" opacity="0.65">
    <path d="M 30,80 C 30,40 50,25 80,25 C 110,25 130,40 130,80 C 130,120 110,135 80,135 C 50,135 30,120 30,80 Z" stroke-dasharray="2,5"/>
  </g>

  <!-- Cute AI Mascot Body (Soft Pebble Cloud) -->
  <path d="M 80 42 C 55 42 45 60 45 82 C 45 106 60 118 80 118 C 100 118 115 106 115 82 C 115 60 105 42 80 42 Z" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="2"/>

  <!-- Botanical Flower Crown / Leaves on head -->
  <path d="M 62 48 C 55 42 56 32 64 36 C 70 38 72 44 62 48 Z" fill="#7D8B74"/>
  <path d="M 98 48 C 105 42 104 32 96 36 C 90 38 88 44 98 48 Z" fill="#7D8B74"/>
  <circle cx="80" cy="40" r="4.5" fill="#E2A6A9"/>
  <circle cx="80" cy="40" r="2" fill="#FFFFFF"/>

  <!-- Big Adorable Anime/Chibi Eyes -->
  <ellipse cx="68" cy="78" rx="6.5" ry="8.5" fill="#3E4A3A"/>
  <ellipse cx="92" cy="78" rx="6.5" ry="8.5" fill="#3E4A3A"/>
  <!-- Eye Sparkles (Highlights) -->
  <circle cx="66" cy="75" r="2.8" fill="#FFFFFF"/>
  <circle cx="70" cy="81" r="1.2" fill="#FFFFFF"/>
  <circle cx="90" cy="75" r="2.8" fill="#FFFFFF"/>
  <circle cx="94" cy="81" r="1.2" fill="#FFFFFF"/>

  <!-- Cute Blush Cheeks -->
  <ellipse cx="58" cy="87" rx="5" ry="2.8" fill="#F4BAC0" opacity="0.8"/>
  <ellipse cx="102" cy="87" rx="5" ry="2.8" fill="#F4BAC0" opacity="0.8"/>

  <!-- Sweet Happy Smile -->
  <path d="M 75 87 Q 80 92 85 87" fill="none" stroke="#5C6B52" stroke-width="2" stroke-linecap="round"/>

  <!-- Tiny Glowing AI Star Antenna / Magic Sparkle -->
  <path d="M 116 54 Q 120 48 126 50 Q 120 52 116 54 Z" fill="#D49B9E"/>
  <circle cx="122" cy="46" r="2.2" fill="#C2A676"/>
</svg>
